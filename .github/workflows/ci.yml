name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (tax engine, letter reader, translations)
        run: npm test

      - name: index.html is built from src/
        run: npm run check

      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End-to-end tests (desktop and phone)
        run: npm run e2e
