<style>
/* Idea: two offer letters lying on a desk, corrected in red pen. Typed text is what the company says; handwriting is the truth. One world, one theme. */
:root{
  --desk:#16202c; --paper:#fbfbf7; --ink:#1a2333; --faint:#6b7588; --rule:#d9dde5; --pen:#d42a3c; --tick:#1a8a5c; --note:#ffe566;
  --typed:"Courier Prime","Courier New",monospace; --ui:"Instrument Sans","Segoe UI",system-ui,sans-serif; --hand:"Kalam","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
:root[lang="hi"]{--typed:"Noto Sans Devanagari","Nirmala UI",sans-serif;--ui:"Noto Sans Devanagari","Nirmala UI",sans-serif}
:root[lang="kn"]{--typed:"Noto Sans Kannada","Nirmala UI",sans-serif;--ui:"Noto Sans Kannada","Nirmala UI",sans-serif;--hand:"Baloo Tamma 2","Noto Sans Kannada",sans-serif}
:root:not([lang="en"]) h2,:root:not([lang="en"]) .end span{letter-spacing:0;font-size:13px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;
  background-image:radial-gradient(circle at 20% 0%,#223247 0,transparent 55%)}
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:20px}
.mast{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;color:#e8edf5}
.mast h1{font:700 22px var(--typed);letter-spacing:.5px;margin:0}
.mast h1 s{text-decoration-color:var(--pen);text-decoration-thickness:3px;color:#93a0b5}
.mast h1 em{font:700 26px var(--hand);color:#ff6b7a;margin-left:6px}
.mast p{margin:0;color:#9fabbf;max-width:58ch;flex:1 1 300px}
.langs{display:flex;gap:4px;margin-left:auto}
.langs button{font:600 13px/1 "Instrument Sans","Noto Sans Devanagari","Noto Sans Kannada",sans-serif;color:#c9d3e3;background:none;border:1.5px solid #3a4a60;border-radius:999px;padding:8px 12px;cursor:pointer;min-height:36px}
.langs button[aria-pressed="true"]{background:#e8edf5;color:var(--desk);border-color:#e8edf5}

.sticky{align-self:flex-start;background:var(--note);color:#3a3200;padding:14px 18px 12px;max-width:640px;transform:rotate(-.8deg);box-shadow:0 10px 22px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.5) inset;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.sticky strong{font:600 21px/1.3 var(--ui);flex:1 1 300px;text-wrap:balance}
.btn{font:600 13px var(--ui);background:var(--ink);color:#fff;border:0;border-radius:6px;padding:9px 13px;cursor:pointer;min-height:38px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.pen{background:var(--pen)}
.link{font:600 13px var(--ui);color:var(--pen);background:none;border:0;border-bottom:1.5px solid currentColor;padding:2px 0;cursor:pointer}

.desk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px;align-items:start}
.sheet{background:var(--paper);padding:26px 26px 22px;box-shadow:0 18px 40px rgba(0,0,0,.4);position:relative;display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet:nth-child(2){transform:rotate(.35deg)}
.sheet.pick::after{content:attr(data-stamp);position:absolute;top:-17px;right:22px;font:700 17px var(--hand);color:var(--tick);border:2.5px solid var(--tick);border-radius:50%;padding:6px 14px 3px;transform:rotate(8deg);background:var(--paper)}
.lh{display:flex;gap:10px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:8px}
.lh input{font:700 18px var(--typed);color:var(--ink);background:none;border:0;min-width:0;flex:1;padding:2px 0;text-transform:uppercase;letter-spacing:1px}
.typed{font:400 14px/1.55 var(--typed);margin:0;color:var(--ink)}
.claim{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;min-height:74px}
.paper{display:flex;flex-direction:column;gap:6px}
.onpaper{font:400 13px var(--ui);color:var(--faint)}
.struck{align-self:flex-start;font:700 clamp(28px,6vw,38px)/1 "Courier Prime",monospace;position:relative;white-space:nowrap;color:var(--faint);font-variant-numeric:tabular-nums}
.struck::after{content:"";position:absolute;left:-5%;right:-5%;top:46%;height:4px;background:var(--pen);border-radius:3px;transform:rotate(-3deg);transform-origin:left}
.claim.ink .struck::after{animation:strike .5s .1s cubic-bezier(.6,0,.2,1) both}
.real{font:500 14px/1.3 var(--ui);color:var(--pen);transform:rotate(-2deg)}
.claim.ink .real{animation:write .4s .5s both}
.real b{display:block;font-family:Kalam,var(--hand);font-size:clamp(34px,7vw,46px);line-height:1;font-variant-numeric:tabular-nums}
@keyframes strike{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes write{from{opacity:0;transform:rotate(-2deg) translateY(4px)}to{opacity:1;transform:rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){.claim.ink .struck::after,.claim.ink .real{animation:none}}
.fill{font:400 14.5px/2 var(--ui);margin:0}
.fill input,.fill select,.own input,.own select{font:600 14.5px var(--ui);color:var(--pen);background:none;border:0;border-bottom:1.5px dashed var(--faint);padding:1px 2px;border-radius:0;max-width:100%}
.fill input{width:5.2ch;text-align:center}
.fill select{cursor:pointer}
:focus-visible{outline:2.5px solid #2f6fe0;outline-offset:2px}
h2{font:700 12px var(--ui);letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);margin:6px 0 -6px}
table{width:100%;border-collapse:collapse;font:400 14px var(--ui);font-variant-numeric:tabular-nums}
td{padding:4px 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
td.n{text-align:right;white-space:nowrap;padding-left:8px}
td.m{font:500 12.5px/1.25 var(--ui);color:var(--pen);padding-left:10px;width:38%}
tr.gone td:first-child,tr.gone td.n{color:var(--faint)}
tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;padding-top:6px}
tr.bank td{border-bottom:0;font-weight:700;font-size:16px;padding-top:7px}
tr.bank td.n{color:var(--pen)}
.margin{font:500 14.5px/1.4 var(--ui);color:var(--pen);margin:0}
.flags{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.flags li{font:500 14px/1.4 var(--ui);padding-left:26px;position:relative}
.flags li::before{position:absolute;left:2px;top:0;font:700 14px var(--ui)}
.flags .bad{color:var(--pen)}.flags .bad::before{content:"✗"}
.flags .warn{color:#a05a00}.flags .warn::before{content:"!"}
.flags .ok{color:var(--tick)}.flags .ok::before{content:"✓"}
.boxes{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.boxes i{aspect-ratio:1;border-radius:2px;display:block}
.boxes i.owe{background:repeating-linear-gradient(45deg,var(--pen) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1.5px var(--pen)}
.key{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:3px 14px;font:400 13px var(--ui);font-variant-numeric:tabular-nums}
.key li{display:flex;gap:7px;align-items:center}
.key i{width:11px;height:11px;border-radius:2px;flex:none}
.key b{margin-left:auto;font-weight:400}
.end{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-top:2px solid var(--ink);padding-top:10px}
.end span{font:700 12px var(--ui);letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.end b{font:700 34px/1 Kalam,var(--hand);margin-left:auto;font-variant-numeric:tabular-nums}
.end b.pos{color:var(--tick)}.end b.neg{color:var(--pen)}
.end small{flex-basis:100%;font:500 14px var(--ui);color:var(--pen)}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
details summary{cursor:pointer;font:600 13px var(--ui);color:var(--faint)}
.own{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px}
.own label{display:flex;flex-direction:column;gap:2px;font:600 11px var(--ui);color:var(--faint)}
.own input,.own select{width:100%}
.how{color:#9fabbf;font-size:13px;max-width:78ch;margin:0}
.how b{color:#e8edf5}

@media (max-width:520px){
  .sheet{padding:22px 18px 18px}.sheet:nth-child(2){transform:none}
  tr{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--rule)}td{border-bottom:0}
  td.m{grid-column:1/-1;width:auto;padding:0 0 5px}td.m:empty{display:none}
  tr.tot{border-bottom:0;border-top:2px solid var(--ink)}tr.tot td{border-top:0}tr.bank{border-bottom:0}
}
.priv{font:600 13px var(--ui)!important;color:var(--tick)!important;border:1.5px solid var(--tick);border-radius:6px;padding:7px 10px;align-self:flex-start}
.fmt{display:flex;flex-wrap:wrap;gap:6px}
.fmt button{font:600 13px var(--ui);background:none;border:1.5px solid var(--rule);color:var(--ink);border-radius:999px;padding:8px 12px;cursor:pointer;min-height:38px}
.fmt button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs{display:none}
@media (max-width:760px){
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:sticky;top:0;z-index:3;background:var(--desk);padding:8px 0;margin:-8px 0 -10px}
  .tabs button{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:0 6px;text-align:left;font:600 13px var(--ui);color:#c9d3e3;background:#1f2b3b;border:1.5px solid #34465e;border-radius:10px;padding:8px 10px;cursor:pointer;min-height:52px}
  .tabs button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs button b{font:700 17px Kalam,var(--hand);grid-row:span 2;align-self:center}
  .tabs button small{font:400 11px var(--ui);color:#8fa0b8}
  .tabs button b.pos{color:#4fd1a0}.tabs button b.neg{color:#ff6b7a}
  .tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .tabs button[aria-selected="true"] b.pos{color:var(--tick)}.tabs button[aria-selected="true"] b.neg{color:var(--pen)}.tabs button[aria-selected="true"] small{color:var(--faint)}
  .desk[data-show="0"] .sheet:nth-child(2),.desk[data-show="1"] .sheet:nth-child(1){display:none}
  .sheet.pick::after{top:-14px}
}
.veil{position:fixed;inset:0;background:rgba(10,15,22,.72);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:5}
.veil[hidden]{display:none}
.modal{background:var(--paper);width:100%;max-width:560px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.modal h3{font:700 18px var(--typed);margin:0}
.modal p{margin:0;color:var(--faint);font-size:14px}
.modal textarea{font:400 13px/1.5 var(--typed);width:100%;min-height:190px;border:1.5px solid var(--rule);background:#fff;padding:10px;color:var(--ink);resize:vertical}
.modal .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modal .err{color:var(--pen);font:500 14px var(--ui)}
.modal img{width:100%;height:auto;box-shadow:0 6px 18px rgba(0,0,0,.25)}
input[type=file]{font:500 13px var(--ui);max-width:100%}
</style>

<body>
<div class="wrap">
  <header class="mast"><h1><s>CTC</s><em>Reality</em></h1><p id="tag"></p><div class="langs" role="group" aria-label="Language"><button data-lang="en">English</button><button data-lang="hi" lang="hi">हिन्दी</button><button data-lang="kn" lang="kn">ಕನ್ನಡ</button></div></header>
  <div class="sticky"><strong id="verdict"></strong></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Offers"></div>
  <main class="desk" id="desk"></main>
  <p class="how" id="how"></p>
</div>

<div class="veil" id="reader" hidden><div class="modal" role="dialog" aria-labelledby="rd-t">
  <h3 id="rd-t">Read my offer letter</h3>
  <p class="priv" id="priv"></p>
  <p id="rd-i"></p>
  <textarea id="rd-text" placeholder="Basic Salary            4,80,000&#10;House Rent Allowance    2,40,000&#10;..."></textarea>
  <div class="row"><input type="file" id="rd-file" accept=".pdf,.txt,application/pdf,text/plain,image/*"></div>
  <div class="err" id="rd-err"></div>
  <div class="row"><button class="btn pen" id="rd-go">Read it</button><button class="btn ghost" id="rd-sample">Try a sample letter</button><button class="btn ghost" id="rd-x">Cancel</button></div>
</div></div>
<div class="veil" id="share" hidden><div class="modal" role="dialog" aria-labelledby="sh-t">
  <h3 id="sh-t">Share card</h3>
  <div class="fmt" role="group" aria-label="Card size"><button data-f="45" id="f45"></button><button data-f="169" id="f169"></button></div>
  <img id="sh-img" alt="Share card showing the offer and what it really pays">
  <p id="sh-h"></p>
  <div class="row"><button class="btn" id="sh-copy">Copy as text</button><button class="btn ghost" id="sh-x">Close</button></div>
</div></div>

<script>
// CTC Reality engine: tax, salary structure, living costs, offer-letter reader.
// Pure functions with no DOM access, so the same file runs in the browser and in Node tests.
// Tax rules: India, FY 2026-27, new regime (Section 115BAC).
const SLABS = [[400000, 0], [800000, .05], [1200000, .10], [1600000, .15], [2000000, .20], [2400000, .25], [Infinity, .30]];
const STD_DED = 75000, REBATE_LIMIT = 1200000;
function incomeTax(gross) {
  const ti = Math.max(0, gross - STD_DED); let tax = 0, prev = 0;
  for (const [lim, r] of SLABS) { if (ti > prev) tax += (Math.min(ti, lim) - prev) * r; prev = lim; }
  if (ti <= REBATE_LIMIT) tax = 0; else tax = Math.min(tax, ti - REBATE_LIMIT);
  return Math.round(withSurcharge(ti, tax) * 1.04);
}
function slabTax(ti) { let tax = 0, prev = 0; for (const [lim, r] of SLABS) { if (ti > prev) tax += (Math.min(ti, lim) - prev) * r; prev = lim; } return tax; }
// Surcharge with marginal relief: crossing a threshold can't cost more than the income above it. New regime caps at 25%.
function withSurcharge(ti, tax) {
  const steps = [[20000000, .25], [10000000, .15], [5000000, .10]];
  for (let i = 0; i < steps.length; i++) {
    const [th, rate] = steps[i]; if (ti <= th) continue;
    const below = i + 1 < steps.length ? steps[i + 1][1] : 0;
    return Math.min(tax * (1 + rate), slabTax(th) * (1 + below) + (ti - th));
  }
  return tax;
}
// True when the ₹12 lakh rebate's marginal relief is what sets the tax.
function inRelief(gross) { const ti = gross - STD_DED; return ti > REBATE_LIMIT && slabTax(ti) > ti - REBATE_LIMIT;
}
// Monthly living costs for one person. Starting estimates, meant to be overwritten.
const CITIES = {
  'Bengaluru': { rent: [11000, 17000, 28000], k: 1, pt: 200 }, 'Mumbai': { rent: [14000, 24000, 40000], k: 1.05, pt: 200 },
  'Gurugram': { rent: [11000, 17000, 28000], k: 1, pt: 0 }, 'Hyderabad': { rent: [9000, 14000, 22000], k: .95, pt: 200 },
  'Pune': { rent: [9000, 14000, 22000], k: .95, pt: 200 }, 'Chennai': { rent: [9000, 13000, 20000], k: .92, pt: 200 },
  'Kolkata': { rent: [7000, 10000, 15000], k: .85, pt: 200 }, 'Ahmedabad': { rent: [7000, 10000, 15000], k: .85, pt: 200 },
  'Kochi': { rent: [7000, 10000, 14000], k: .85, pt: 200 }, 'Jaipur': { rent: [6500, 9000, 13000], k: .82, pt: 200 },
  'Indore': { rent: [6000, 8000, 12000], k: .8, pt: 200 }
};
const FOOD = [5500, 9000, 14000], RIDE = [2000, 3200, 9000];
const PARTS = ['basic', 'hra', 'special', 'epfEmployer', 'gratuity', 'variable', 'oneTime', 'other'];

function derive(o) {
  if (o.mode === 'letter' && o.comp) return { ...o.comp };
  const ctc = o.lpa * 100000, variable = ctc * o.varPct / 100, fixed = ctc - variable, basic = fixed * o.basicPct / 100;
  const epfEmployer = o.pf === 'none' ? 0 : o.pf === 'cap' ? Math.min(basic * .12, 21600) : basic * .12, gratuity = basic * .0481;
  let hra = basic * .4, special = fixed - basic - hra - epfEmployer - gratuity; if (special < 0) { hra = Math.max(0, hra + special); special = 0; }
  return { basic, hra, special, epfEmployer, gratuity, variable, oneTime: 0, other: 0, ctc };
}
function compute(o) {
  const c = derive(o), sum = PARTS.reduce((s, k) => s + (c[k] || 0), 0), ctc = c.ctc || sum;
  const gross = c.basic + c.hra + c.special, epf = c.epfEmployer, city = CITIES[o.city] || CITIES.Bengaluru, pt = city.pt * 12;
  const taxFixed = incomeTax(gross), taxVar = incomeTax(gross + c.variable) - taxFixed, taxOnce = incomeTax(gross + c.variable + c.oneTime) - taxFixed - taxVar;
  const inHand = (gross - epf - pt - taxFixed) / 12;
  const rent = o.rent != null ? o.rent : city.rent[o.home], food = Math.round(FOOD[o.food] * city.k / 100) * 100, ride = Math.round(RIDE[o.ride] * city.k / 100) * 100;
  const spendParts = [['Rent', rent], ['Food', food], ['Travel', ride], ['Bills, phone, fun', o.other], ['EMI + sent home', o.emi]].filter(p => p[1] > 0);
  const spend = spendParts.reduce((s, p) => s + p[1], 0), left = inHand - spend;
  return { c, ctc, sum, gap: ctc - sum, gross, epf, pt, taxFixed, inHand, variableNet: c.variable - taxVar, oneTimeNet: c.oneTime - taxOnce,
    rent, food, ride, spendParts, spend, left, saveRate: inHand > 0 ? left / inHand : 0, runOutDay: left < 0 ? Math.max(1, Math.floor(30 * inHand / spend)) : null,
    neverMonthly: ctc - gross };
}
// Split a month into 30 boxes by where the money goes. Returns [{label, n}], plus borrowed boxes when short.
function monthBoxes(r) {
  const base = r.left >= 0 ? r.inHand : r.spend, items = r.spendParts.map(p => [p[0], p[1]]); if (r.left > 0) items.push(['Left over', r.left]);
  const raw = items.map(p => 30 * p[1] / base), n = raw.map(Math.floor); let rest = 30 - n.reduce((a, b) => a + b, 0);
  raw.map((v, i) => [v - n[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { n[i]++; rest--; } });
  return { boxes: items.map((p, i) => ({ label: p[0], amount: p[1], n: n[i] })), funded: r.left >= 0 ? 30 : r.runOutDay };
}

// ---------- offer letter reader ----------
const RULES = [
  ['skip', /employee'?s?\s+(contribution|share)|deduction|net\s+(pay|salary|take)|take[\s-]?home|in[\s-]?hand/],
  ['ctc', /cost\s+to\s+(the\s+)?company|total\s+(annual\s+)?(ctc|compensation|cost|package)|annual\s+ctc|\bctc\b|total\s+rewards?/],
  ['skip', /gross|sub[\s-]?total|total|fixed\s+(pay|compensation|salary|ctc)/],
  ['oneTime', /joining|sign[\s-]?on|relocation|one[\s-]?time|retention/],
  ['variable', /variable|performance|incentive|annual\s+bonus|target\s+bonus|bonus/],
  ['gratuity', /gratuity/],
  ['epfEmployer', /provident|\bepf\b|\bpf\b/],
  ['other', /insurance|mediclaim|medical\s+cover|\bnps\b|superannuation|esop|\brsu|stock|meal\s+(card|coupon|voucher)|food\s+coupon|\besi\b/],
  ['basic', /basic/],
  ['hra', /house\s+rent|\bhra\b/],
  ['special', /allowance|special|\blta\b|leave\s+travel|conveyance|flexi|telephone|bouquet|city\s+compensatory|statutory/]
];
function nums(line) {
  const out = []; let m;
  const lakh = /(\d+(?:\.\d+)?)\s*(lpa|lakhs?|lacs?)\b/gi; while ((m = lakh.exec(line))) out.push(parseFloat(m[1]) * 100000);
  const dated = /\b(fy|year|dated?|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b|\d[\/-]\d/i.test(line);
  const re = /(\d{1,3}(?:,\d{2,3})+|\d{4,})(?:\.\d+)?/g;
  while ((m = re.exec(line))) { const v = parseFloat(m[1].replace(/,/g, '')); if (dated && !m[1].includes(',') && v >= 1900 && v <= 2100) continue; out.push(v); }
  return out;
}
// Fix what phone OCR typically gets wrong in Indian amounts: 4.80.000 for 4,80,000, letter O for zero.
function cleanOcr(text) {

function applyLetter(text){const r=parseLetter(text);
  if(!r.ok){$('rd-err').textContent=t(text.trim().length<20?'e_empty':'e_nobasic');return}
  const o=S[target];o.mode='letter';o.comp=r.comp;o.flags=r.flags;o.lpa=Math.round(r.comp.ctc/10000)/10;$('reader').hidden=true;paint();$('o'+target+'-sheet').scrollIntoView({block:'start',behavior:'smooth'})}
async function pdfText(file){
  if(!window.pdfjsLib)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='vendor/pdf.min.js';s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)});
  pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let out='';
  for(let n=1;n<=Math.min(doc.numPages,30);n++){const tc=await (await doc.getPage(n)).getTextContent(),lines={};
    for(const it of tc.items){if(!it.str.trim())continue;const y=Math.round(it.transform[5]/3);(lines[y]=lines[y]||[]).push([it.transform[4],it.str])}
    out+=Object.keys(lines).sort((a,b)=>b-a).map(y=>lines[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join('  ')).join('\n')+'\n'}
  return out}
let ocrWorker=null;
async function ocrText(file){const abs=p=>new URL(p,location.href).href;
  if(!ocrWorker){$('rd-err').textContent=t('ocrload');
    if(!window.Tesseract)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='vendor/ocr/tesseract.min.js';s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)});
    const lang=new Uint8Array(await (await fetch('vendor/ocr/eng-traineddata.wasm')).arrayBuffer());
    ocrWorker=await Tesseract.createWorker([{code:'eng',data:lang}],1,{workerPath:abs('vendor/ocr/worker.min.js'),corePath:abs('vendor/ocr/'),workerBlobURL:false,cacheMethod:'none',
      logger:m=>{if(m.status==='recognizing text')$('rd-err').textContent=t('ocr',{p:Math.round(100*m.progress)})}})}
  const {data}=await ocrWorker.recognize(file);return cleanOcr(data.text)}

  const isImg=/^image\//.test(f.type)||/\.(png|jpe?g|webp|heic)$/i.test(f.name);
  if(isImg){try{const x=await ocrText(f);$('rd-text').value=x;const r=parseLetter(x);if(!r.ok){$('rd-err').textContent=t('e_ocr');e.target.value='';return}$('rd-err').textContent='';applyLetter(x)}catch(err){$('rd-err').textContent=t('e_ocr')}e.target.value='';return}
  try{const x=/pdf$/i.test(f.name)||f.type==='application/pdf'?await pdfText(f):await f.text();
    if(x.replace(/\s/g,'').length<40){$('rd-err').textContent=t('e_scan');return}

  catch(err){$('rd-err').textContent=t('e_file')}e.target.value=''});
